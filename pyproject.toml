[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torch-dimensions"
version = "0.0.0"
description = "N-dimensional sequence models for PyTorch: SSMs, RNNs, and transformers over arbitrary lattices"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "triadastra" }]
keywords = ["pytorch", "state-space-models", "mamba", "s4", "axial-attention", "multidimensional"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# torch and nothing else. Every fused kernel is an optional extra, so a
# CPU-only install still gets a working library (see PLAN.md, Phase 0).
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
mamba = ["mamba-ssm>=2.0"]
fla = ["flash-linear-attention"]
# state-spaces/s4 is not published to PyPI; the standalone S4 module needs these
# and the source is vendored or installed from git by the user.
s4 = ["einops", "opt-einsum"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6", "mypy", "hypothesis", "pyyaml"]
all = ["torch-dimensions[mamba,fla,s4]"]

[project.urls]
Homepage = "https://github.com/triadastra/torch-dimensions"
Source = "https://github.com/triadastra/torch-dimensions"

[tool.hatch.build.targets.wheel]
packages = ["src/torch_dimensions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA device (deselect with '-m \"not gpu\"')",
    "mamba: requires the [mamba] extra",
]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
